<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GROUNDTRUTH 04 — Robustness</title>
<link rel="stylesheet" href="atlas.css" />
</head>
<body>
<div class="page">
  <header class="mast">
    <div id="locator" aria-hidden="true"></div>
    <div>
      <p class="kicker">Groundtruth / Jamaica Bay / 04</p>
      <h1>What survives the pushing</h1>
      <p class="deck">Every way we could think of to make the slope go away, and what each one did to it.</p>
    </div>
  </header>
  <div id="app"></div>
</div>
<script src="atlas.js"></script>
<script>
"use strict";
(function () {
  var view = { track: "descending_069" };

  ATLAS.boot("robustness", function (ctx) {
    var A = ATLAS, host = ctx.host, R = A.ROBUST;
    if (!R) {
      host.appendChild(A.h("div", "err",
        "<b>robustness.json is missing.</b> Run <code>backend/scripts/make_robustness.py</code> to generate it. " +
        "Everything on this page is read from that file."));
      return;
    }
    var orbit = view.track, o = A.ORBITS[orbit];
    var variant = (orbit === "ascending_133" && R.tracks[orbit].variants.coverage_screened) ? "coverage_screened" : "all_dates";
    var v = R.tracks[orbit].variants[variant];
    var M = A.MODELS.tracks[orbit].series[variant] || A.MODELS.tracks[orbit].series.all_dates;

    host.appendChild(A.h("p", "lede",
      "A polished regression line is easy to draw and easy to distrust. This chapter is the audit: the same slope " +
      "estimated four ways, re-estimated with every single acquisition removed in turn, checked for the one " +
      "assumption most at risk in a time series, and traced across every coverage rule we could have chosen. " +
      "Nothing here is a new measurement — it is all computed from the exported products by " +
      "<span class=\"mono\">make_robustness.py</span>, with a fixed seed."));

    var ctl = A.h("div", "ctl");
    ctl.innerHTML = '<span class="ctl-label">Track</span><span class="seg" id="tk">' +
      Object.keys(A.ORBITS).map(function (k) {
        return '<button data-v="' + k + '" aria-pressed="' + (k === orbit) + '">' + A.ORBITS[k].label + "</button>";
      }).join("") + "</span>" +
      '<span class="ctl-label mono" style="font-size:12px">' +
      (variant === "coverage_screened" ? "coverage-screened dates" : "all dates") + " · n = " + v.n + "</span>";
    host.appendChild(ctl);
    ctl.querySelector("#tk").onclick = function (e) { var b = e.target.closest("button"); if (b) { view.track = b.dataset.v; A.redraw(); } };

    // --- one slope, four intervals -------------------------------------------
    var s1 = A.h("section", "tight");
    host.appendChild(s1);
    s1.appendChild(A.h("h2", null, "One slope, four ways of putting an interval on it"));
    s1.appendChild(A.h("p", "prose",
      "The published interval is the classical OLS one, which assumes the scatter around the line is constant and " +
      "the errors independent. Three alternatives relax those assumptions in different directions: " +
      A.def("HC3", "Heteroskedasticity-consistent standard errors (MacKinnon-White). Does not assume constant variance; inflates the contribution of high-leverage points.") +
      " allows the scatter to vary with water level, the " +
      A.def("pairs bootstrap", "Resample whole (water level, backscatter) pairs 10,000 times and refit. Assumes neither normal errors nor constant variance.") +
      " assumes neither normality nor constant variance, and " +
      A.def("Theil–Sen", "The median of the slopes of all pairs of points. Highly resistant to outliers: it tolerates up to ~29% contaminated data.") +
      " is a median-of-pairwise-slopes estimator that barely notices outliers. They agree."));
    A.forest(s1, [
      { label: "OLS", sub: "published interval", value: v.ols.slope.estimate, ci: v.ols.slope.ci95_ols, color: o.color, shape: o.shape, bold: true },
      { label: "OLS with HC3 errors", sub: "heteroskedasticity-consistent", value: v.ols.slope.estimate, ci: v.ols.slope.ci95_hc3, color: o.color, shape: o.shape },
      { label: "Pairs bootstrap", sub: v.bootstrap.draws.toLocaleString() + " draws · percentile", value: v.bootstrap.slope_median, ci: v.bootstrap.slope_ci95, color: o.color, shape: o.shape },
      { label: "Theil–Sen", sub: "median of pairwise slopes", value: v.theil_sen.slope_db_per_m, ci: v.theil_sen.ci95, color: A.MUTED, shape: o.shape }
    ], { width: 840, labelW: 230, label: "Four intervals on the same slope" });
    s1.appendChild(A.h("p", "cap",
      "All four exclude zero" + (v.bootstrap.fraction_negative >= 0.99 ? "; " + A.pct(v.bootstrap.fraction_negative, 1) + " of bootstrap draws are negative" : "") +
      ". The Theil–Sen estimate is " + (Math.abs(v.theil_sen.slope_db_per_m) > Math.abs(v.ols.slope.estimate) ? "steeper" : "shallower") +
      " than OLS, which means the outliers are pulling the least-squares line toward zero rather than creating the relationship."));
    s1.appendChild(A.h("div", "evidence",
      '<span class="tier diagnostic">diagnostic</span><b>modelled</b> · all four fitted to the same ' + v.n +
      " dates · bootstrap seeded, so this figure is reproducible · " + v.date_range[0] + " to " + v.date_range[1]));

    // --- leave one out ---------------------------------------------------------
    var s2 = A.h("section");
    host.appendChild(s2);
    var loo = v.leave_one_out;
    s2.appendChild(A.h("h2", null, "No single acquisition is carrying the result"));
    s2.appendChild(A.h("p", "prose",
      "Each mark below is the slope re-estimated with one date removed. Across all " + v.n + " refits the slope stays " +
      "between <span class=\"num\">" + A.fx(loo.range[0]) + "</span> and <span class=\"num\">" + A.fx(loo.range[1]) +
      "</span> dB/m" + (loo.all_negative ? " and never changes sign" : "") + ". The most influential date is " +
      "<b>" + loo.most_influential_date + "</b>, whose removal moves the slope by " +
      "<span class=\"num\">" + A.sgn(loo.largest_dfbeta_db_per_m) + "</span> dB/m — click it to select it."));
    drawLoo(s2, loo, v.ols.slope.estimate, o);

    // --- influence --------------------------------------------------------------
    var s3 = A.h("section");
    host.appendChild(s3);
    s3.appendChild(A.h("h2", null, "Which dates sit furthest from the line, and does it matter"));
    s3.appendChild(A.h("p", "prose",
      "A point far from the fitted line is not automatically bad data — it may be real environmental variability, or " +
      "a sign the straight line is the wrong shape. What matters is whether it is also <b>high leverage</b>: an " +
      "extreme water level, where a single point can swing the whole line. Cook's distance combines the two."));
    var trio = A.h("div", "trio");
    s3.appendChild(trio);
    drawResidFitted(trio, v, o);
    drawResidDate(trio, v, o);
    drawCooks(trio, v, o);
    var rd = v.residual_diagnostics;
    s3.appendChild(A.h("p", "prose",
      "<b>The assumption most at risk is independence.</b> These are sequential observations twelve days apart, and " +
      "the residuals carry a lag-1 autocorrelation of <span class=\"num\">" + A.fx(rd.lag1_autocorrelation) + "</span> " +
      "(Durbin–Watson <span class=\"num\">" + A.fx(rd.durbin_watson) + "</span>; 2.0 would mean no serial correlation). " +
      (rd.lag1_autocorrelation > 0.25
        ? "That is real positive correlation: neighbouring dates resemble each other more than independent draws would, " +
          "so the classical interval is optimistically narrow and the effective sample size is below " + v.n + ". " +
          "Season, vegetation state, antecedent rainfall and surface wetness are all plausible causes, and with about " +
          "one year of data they cannot be separated from each other. The held-out test in chapter 05 is the honest " +
          "answer to this: it asks the model to work on dates it never saw, which serial correlation cannot fake."
        : "That is small enough not to worry the intervals here, though the held-out test in chapter 05 remains the stronger evidence.")));
    s3.appendChild(A.h("div", "evidence",
      '<span class="tier diagnostic">diagnostic</span><b>modelled</b> · residuals from the OLS fit on these ' + v.n +
      " dates · standardised residual = residual ÷ its own standard error · Cook's distance measures how far every " +
      "fitted value moves when that date is dropped"));

    // --- the coverage rule ------------------------------------------------------
    var s4 = A.h("section");
    host.appendChild(s4);
    s4.appendChild(A.h("h2", null, "The coverage threshold is a discrete fact, not a tuned knob"));
    s4.appendChild(A.h("p", "prose",
      "The 90% coverage rule was chosen after the ascending outlier was seen. The defensible way to show such a " +
      "choice is not to assert it but to sweep it: the slope is re-estimated at every threshold from keeping " +
      "everything to demanding complete coverage."));
    drawSweep(s4, R.tracks[orbit].coverage_sweep, o);

    // --- the predictor ----------------------------------------------------------
    var s5 = A.h("section");
    host.appendChild(s5);
    var g = R.gauges;
    s5.appendChild(A.h("h2", null, "How well is the water level itself known?"));
    s5.appendChild(A.h("p", "prose",
      "The predictor is the mean of two gauges, Inwood and Rockaway, read within " +
      "<span class=\"num\">" + (g.max_offset_s / 60).toFixed(1) + "</span> minutes of the overpass at worst " +
      "(median <span class=\"num\">" + (g.median_offset_s / 60).toFixed(1) + "</span> minutes, nothing interpolated). " +
      "The gauges do not always agree: the median absolute difference between them is " +
      "<span class=\"num\">" + A.fx(g.median_abs_difference_m) + "</span> m, and it exceeds 0.10 m on " +
      "<b>" + g.n_above_0_10_m + " of " + g.n + "</b> overpasses, reaching " +
      "<span class=\"num\">" + A.fx(g.max_abs_difference_m) + "</span> m."));
    drawGauges(s5, g);
    s5.appendChild(A.h("p", "prose",
      "<b>This matters for chapter 07.</b> Two passes declared \"tide-matched\" within ±0.05 m can differ by more " +
      "than that in the bay itself, because the single number h is already averaging over a gradient of this size. " +
      "The tolerance is a statement about the gauge mean, not about the water surface everywhere in the bay. " +
      "At a slope near " + A.fx(v.ols.slope.estimate) + " dB/m, a 0.10 m error in h corresponds to about " +
      "<span class=\"num\">" + A.fx(Math.abs(v.ols.slope.estimate) * 0.10) + "</span> dB of backscatter — small next " +
      "to the " + A.fx(v.ols.residual_sd_db) + " dB of residual scatter, which is why this is a limitation rather than a refutation."));
    s5.appendChild(A.h("div", "evidence",
      '<span class="tier diagnostic">diagnostic</span><b>measured</b> · USGS 01311850 and 01311875, both tracks, ' +
      g.n + " overpasses · classical regression assumes the predictor is known exactly; it is not"));

    // --- the response -----------------------------------------------------------
    var s6 = A.h("section");
    host.appendChild(s6);
    var up = R.tracks[orbit].upland, rc = R.tracks[orbit].response_choice;
    s6.appendChild(A.h("h2", null, "Why subtract the upland reference at all?"));
    s6.appendChild(A.h("p", "prose",
      "The response is marsh HH minus a nearby upland reference, which should cancel anything affecting the whole " +
      "acquisition — calibration drift, atmosphere, processing. That subtraction is only legitimate if the upland " +
      "itself does not respond to the tide. It does not: regressing upland HH on water level gives " +
      "<span class=\"num\">" + A.sgn(up.upland_slope.estimate) + "</span> dB/m, 95% CI " + A.ci(up.upland_slope.ci95_hc3) +
      ", which straddles zero and is an order of magnitude smaller than the marsh response."));
    var t = A.h("table", "num-table");
    t.innerHTML =
      "<thead><tr><th>Response</th><th>Slope on h</th><th>Held-out RMSE, constant</th><th>Held-out RMSE, tide model</th><th>Improvement</th></tr></thead><tbody>" +
      '<tr class="hi"><td>Marsh − upland HH <span class="mono" style="color:var(--muted)">(used everywhere)</span></td><td>' +
        A.fx(v.ols.slope.estimate) + "</td><td>" + A.fx(rc.marsh_minus_upland.constant_rmse_db) + "</td><td>" +
        A.fx(rc.marsh_minus_upland.tide_rmse_db) + "</td><td>" + A.pct(rc.marsh_minus_upland.improvement_vs_constant) + "</td></tr>" +
      "<tr><td>Marsh HH alone</td><td>" + A.fx(rc.marsh_only.beta_train_db_per_m) + "</td><td>" +
        A.fx(rc.marsh_only.constant_rmse_db) + "</td><td>" + A.fx(rc.marsh_only.tide_rmse_db) + "</td><td>" +
        A.pct(rc.marsh_only.improvement_vs_constant) + "</td></tr>" +
      "<tr><td>Upland HH alone</td><td>" + A.sgn(up.upland_slope.estimate) + "</td><td colspan=\"3\" style=\"text-align:left;color:var(--muted)\">" +
        "the control: no tide response to predict</td></tr></tbody>";
    s6.appendChild(t);
    s6.appendChild(A.h("p", "prose",
      "<b>An honest result that cuts the other way:</b> on the same chronological split, marsh HH on its own " +
      "predicts the held-out dates very slightly better (" + A.fx(rc.marsh_only.tide_rmse_db) + " dB RMSE against " +
      A.fx(rc.marsh_minus_upland.tide_rmse_db) + "). The subtraction is kept because it guards against " +
      "acquisition-wide radiometric drift, which " + rc.marsh_minus_upland.n_test + " test dates in a single year " +
      "cannot rule out, not because it improves accuracy here. Both responses give the same sign, the same " +
      "conclusion, and overlapping intervals."));
    s6.appendChild(A.h("div", "evidence",
      '<span class="tier sensitivity">sensitivity</span><b>modelled</b> · same dates, same split, only the response ' +
      "differs · fit on the first half, scored on the second · n test = " + rc.marsh_minus_upland.n_test));

    // ======================= figures =========================================
    function panel(hostEl, title, W, H, build) {
      var box = A.h("div");
      hostEl.appendChild(box);
      box.appendChild(A.h("h3", null, title));
      var svg = A.el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": title });
      build(svg);
      box.appendChild(svg);
      return box;
    }

    function drawLoo(hostEl, loo, full, o) {
      var rows = loo.slopes, W = 1120, H = 210, P = { l: 48, r: 18, t: 20, b: 42 };
      var vals = rows.map(function (r) { return r.slope_db_per_m; }).concat([full]);
      var e = A.ext(vals), pad = (e[1] - e[0]) * 0.3 || 0.05;
      var ts = A.ext(rows.map(function (r) { return Date.parse(r.date + "T00:00:00Z"); }));
      var x = A.scale(ts[0] - 8 * 864e5, ts[1] + 8 * 864e5, P.l, W - P.r);
      var y = A.scale(e[0] - pad, e[1] + pad, H - P.b, P.t);
      var svg = A.el("svg", { viewBox: "0 0 " + W + " " + H, role: "group", "aria-label": "Slope re-estimated with each date removed" });
      A.axes(svg, x, y, P, W, H, A.monthTicks(ts[0], ts[1]), A.ticks(e[0] - pad, e[1] + pad, 4), A.monthFmt, function (t) { return A.fx(t, 2); });
      svg.appendChild(A.el("line", { x1: P.l, x2: W - P.r, y1: y(full), y2: y(full), stroke: A.INK, "stroke-width": 1.3 }));
      svg.appendChild(A.el("text", { x: W - P.r, y: y(full) - 5, "text-anchor": "end", class: "axl" }, "slope with every date in: " + A.fx(full)));
      svg.appendChild(A.el("text", { x: P.l, y: P.t - 5, class: "axl" }, "slope with that date removed (dB/m)"));
      rows.forEach(function (r) {
        var p = A.PTS[orbit].filter(function (q) { return q.date === r.date; })[0];
        if (!p) return;
        var big = r.date === loo.most_influential_date;
        svg.appendChild(A.el("line", { x1: x(p.t), x2: x(p.t), y1: y(full), y2: y(r.slope_db_per_m), stroke: o.color, "stroke-opacity": 0.45 }));
        svg.appendChild(A.mark(p, x(p.t), y(r.slope_db_per_m), {
          r: big ? 5.4 : 4, sel: p.id === A.state.selected,
          title: "Drop " + r.date + "\nslope becomes " + A.fx(r.slope_db_per_m) + " dB/m\nchange " + A.sgn(r.dfbeta_db_per_m)
        }));
        if (big) svg.appendChild(A.el("text", { x: x(p.t), y: y(r.slope_db_per_m) + (r.dfbeta_db_per_m > 0 ? -12 : 18), "text-anchor": "middle", class: "lab", style: "font-size:10.5px" }, r.date));
      });
      hostEl.appendChild(svg);
      hostEl.appendChild(A.h("div", "evidence",
        '<span class="tier diagnostic">diagnostic</span><b>modelled</b> · ' + rows.length +
        " refits, one per dropped date · the vertical stem is that date's DFBETA · a result that depended on one " +
        "acquisition would show one mark far from the rule"));
    }

    function drawResidFitted(hostEl, v, o) {
      var inf = v.influence, W = 360, H = 250, P = { l: 46, r: 12, t: 18, b: 38 };
      var xs = A.ext(inf.map(function (r) { return r.fitted_db; })), ys = A.ext(inf.map(function (r) { return r.residual_db; }));
      var xp = (xs[1] - xs[0]) * 0.08, yp = (ys[1] - ys[0]) * 0.12;
      panel(hostEl, "Residuals against fitted", W, H, function (svg) {
        var x = A.scale(xs[0] - xp, xs[1] + xp, P.l, W - P.r), y = A.scale(ys[0] - yp, ys[1] + yp, H - P.b, P.t);
        A.axes(svg, x, y, P, W, H, A.ticks(xs[0] - xp, xs[1] + xp, 4), A.ticks(ys[0] - yp, ys[1] + yp, 4),
          function (t) { return A.fx(t, 1); }, function (t) { return A.sgn(t, 1); });
        svg.appendChild(A.el("line", { x1: P.l, x2: W - P.r, y1: y(0), y2: y(0), stroke: A.INK }));
        svg.appendChild(A.el("text", { x: (P.l + W - P.r) / 2, y: H - 6, "text-anchor": "middle", class: "axl" }, "fitted value (dB)"));
        inf.forEach(function (r) {
          var p = A.PTS[orbit].filter(function (q) { return q.date === r.date; })[0];
          if (p) svg.appendChild(A.mark(p, x(r.fitted_db), y(r.residual_db), { r: 3.8, sel: p.id === A.state.selected,
            title: r.date + "\nresidual " + A.sgn(r.residual_db) + " dB\nleverage " + A.fx(r.leverage) }));
        });
      }).appendChild(A.h("p", "cap", "A funnel shape would mean the scatter grows with the fitted value; a curve would mean a straight line is the wrong shape."));
    }

    function drawResidDate(hostEl, v, o) {
      var inf = v.influence, W = 360, H = 250, P = { l: 46, r: 12, t: 18, b: 38 };
      var ts = A.ext(inf.map(function (r) { return Date.parse(r.date + "T00:00:00Z"); }));
      var ys = A.ext(inf.map(function (r) { return r.residual_db; })), yp = (ys[1] - ys[0]) * 0.12;
      panel(hostEl, "Residuals against date", W, H, function (svg) {
        var x = A.scale(ts[0] - 8 * 864e5, ts[1] + 8 * 864e5, P.l, W - P.r), y = A.scale(ys[0] - yp, ys[1] + yp, H - P.b, P.t);
        A.axes(svg, x, y, P, W, H, A.monthTicks(ts[0], ts[1]), A.ticks(ys[0] - yp, ys[1] + yp, 4), A.monthFmt, function (t) { return A.sgn(t, 1); });
        svg.appendChild(A.el("line", { x1: P.l, x2: W - P.r, y1: y(0), y2: y(0), stroke: A.INK }));
        var pts = inf.map(function (r) {
          return { t: Date.parse(r.date + "T00:00:00Z"), v: r.residual_db, p: A.PTS[orbit].filter(function (q) { return q.date === r.date; })[0] };
        });
        svg.appendChild(A.el("path", { d: pts.map(function (q, i) { return (i ? "L" : "M") + x(q.t).toFixed(1) + " " + y(q.v).toFixed(1); }).join(""), fill: "none", stroke: o.color, "stroke-width": 1, "stroke-opacity": 0.5 }));
        pts.forEach(function (q) { if (q.p) svg.appendChild(A.mark(q.p, x(q.t), y(q.v), { r: 3.8, sel: q.p.id === A.state.selected })); });
      }).appendChild(A.h("p", "cap", "Runs of same-signed residuals are the serial-correlation problem made visible: neighbouring dates miss the line in the same direction."));
    }

    function drawCooks(hostEl, v, o) {
      var inf = v.influence.slice().sort(function (a, b) { return b.cooks_distance - a.cooks_distance; }).slice(0, 8);
      var box = A.h("div");
      hostEl.appendChild(box);
      box.appendChild(A.h("h3", null, "Most influential dates"));
      var t = A.h("table", "num-table");
      t.innerHTML = "<thead><tr><th>Date</th><th>Resid.</th><th>Lev.</th><th>Cook's D</th></tr></thead><tbody>" +
        inf.map(function (r) {
          return '<tr class="cookrow' + (A.BYID[A.state.selected] && A.BYID[A.state.selected].date === r.date ? " hi" : "") +
            '" data-date="' + r.date + '" style="cursor:pointer"><td>' + r.date + "</td><td>" + A.sgn(r.residual_db) +
            "</td><td>" + A.fx(r.leverage) + "</td><td>" + A.fx(r.cooks_distance) + "</td></tr>";
        }).join("") + "</tbody>";
      t.onclick = function (e) {
        var tr = e.target.closest("tr.cookrow");
        if (!tr) return;
        var p = A.PTS[orbit].filter(function (q) { return q.date === tr.dataset.date; })[0];
        if (p) A.select(p.id);
      };
      box.appendChild(t);
      box.appendChild(A.h("p", "cap",
        "Cook's distance above about " + A.fx(4 / v.n) + " (4/n here) is the usual flag. Click a row to select that " +
        "acquisition and see it on chapter 02's map. None of these was removed from any analysis."));
    }

    function drawSweep(hostEl, sweep, o) {
      var usable = sweep.filter(function (s) { return s.slope_db_per_m != null; });
      var W = 820, H = 260, P = { l: 56, r: 150, t: 20, b: 42 };
      var lo = Math.min.apply(null, usable.map(function (s) { return s.ci95_ols[0]; }));
      var hi = Math.max.apply(null, usable.map(function (s) { return s.ci95_ols[1]; }).concat([0]));
      var pad = (hi - lo) * 0.1;
      var x = A.scale(-0.05, 1.05, P.l, W - P.r), y = A.scale(lo - pad, hi + pad, H - P.b, P.t);
      var svg = A.el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Slope against the minimum coverage threshold" });
      A.axes(svg, x, y, P, W, H, [0, 0.25, 0.5, 0.75, 1], A.ticks(lo - pad, hi + pad, 4),
        function (t) { return A.pct(t); }, function (t) { return A.fx(t, 1); });
      svg.appendChild(A.el("line", { x1: P.l, x2: W - P.r, y1: y(0), y2: y(0), stroke: A.INK, "stroke-width": 1.2 }));
      svg.appendChild(A.el("text", { x: W - P.r, y: y(0) - 5, "text-anchor": "end", class: "axl" }, "no relationship"));
      svg.appendChild(A.el("text", { x: (P.l + W - P.r) / 2, y: H - 6, "text-anchor": "middle", class: "axl" }, "minimum coverage required of a pass"));
      svg.appendChild(A.el("text", { x: P.l, y: P.t - 5, class: "axl" }, "slope (dB/m) with 95% interval"));
      usable.forEach(function (s) {
        var cx = x(s.min_coverage), published = Math.abs(s.min_coverage - 0.9) < 1e-9;
        svg.appendChild(A.el("line", { x1: cx, x2: cx, y1: y(s.ci95_ols[0]), y2: y(s.ci95_ols[1]), stroke: o.color, "stroke-width": published ? 2.4 : 1.4 }));
        svg.appendChild(A.el("circle", { cx: cx, cy: y(s.slope_db_per_m), r: published ? 5.4 : 4, fill: published ? o.color : A.PAPER, stroke: o.color, "stroke-width": 1.8 }));
        svg.appendChild(A.el("title", {}, "keep passes with ≥ " + A.pct(s.min_coverage) + " coverage\nn = " + s.n + "\nslope " + A.fx(s.slope_db_per_m) + " dB/m, 95% CI " + A.ci(s.ci95_ols)));
        svg.appendChild(A.el("text", { x: cx, y: H - P.b + 28, "text-anchor": "middle", class: "labm", style: "font-size:10px;fill:var(--muted)" }, "n=" + s.n));
        if (published) svg.appendChild(A.el("text", { x: cx, y: y(s.ci95_ols[1]) - 10, "text-anchor": "middle", class: "lab", style: "font-size:10.5px;font-weight:600" }, "published rule"));
      });
      hostEl.appendChild(svg);
      var distinct = {};
      usable.forEach(function (s) { distinct[s.n] = 1; });
      hostEl.appendChild(A.h("p", "prose",
        "For this track the sweep takes <b>" + Object.keys(distinct).length + " distinct value" +
        (Object.keys(distinct).length === 1 ? "" : "s") + "</b>, because coverage is not a continuum here: a pass " +
        "either saw the whole bay or it did not. " +
        (orbit === "ascending_133"
          ? "Every threshold from 50% to 100% selects the same 23 dates and returns the same slope. The only real " +
            "choice is binary — keep the two partial passes or do not — and chapter 03 shows both answers side by side."
          : "No descending pass fails any threshold, so the descending slope is unaffected by this rule entirely.")));
      hostEl.appendChild(A.h("div", "evidence",
        '<span class="tier sensitivity">sensitivity</span><b>modelled</b> · one refit per threshold · ' +
        "a multiverse view: the published cut is shown filled, every alternative hollow · " +
        "classical OLS intervals, which do not account for the rule having been chosen after seeing the data"));
    }

    function drawGauges(hostEl, g) {
      var rows = g.per_date, W = 820, H = 220, P = { l: 56, r: 18, t: 20, b: 42 };
      var e = A.ext(rows.map(function (r) { return r.difference_m; }));
      var pad = (e[1] - e[0]) * 0.1;
      var x = A.scale(-1.1, 1.3, P.l, W - P.r), y = A.scale(e[0] - pad, e[1] + pad, H - P.b, P.t);
      var svg = A.el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Difference between the two gauges at each overpass" });
      A.axes(svg, x, y, P, W, H, [-1, -0.5, 0, 0.5, 1], A.ticks(e[0] - pad, e[1] + pad, 4), function (t) { return A.sgn(t, 1); }, function (t) { return A.sgn(t, 2); });
      // The tide-match tolerances, drawn as a band, so the comparison in
      // chapter 07 can be judged against the spread it is competing with.
      A.THRESHOLDS.forEach(function (th) {
        svg.appendChild(A.el("rect", { x: P.l, y: y(th), width: W - P.r - P.l, height: Math.abs(y(-th) - y(th)), fill: A.MARSH, "fill-opacity": 0.07 }));
      });
      svg.appendChild(A.el("line", { x1: P.l, x2: W - P.r, y1: y(0), y2: y(0), stroke: A.INK }));
      svg.appendChild(A.el("text", { x: (P.l + W - P.r) / 2, y: H - 6, "text-anchor": "middle", class: "axl" }, "mean water level at the overpass (m NAVD88)"));
      svg.appendChild(A.el("text", { x: P.l, y: P.t - 5, class: "axl" }, "Inwood − Rockaway (m)"));
      [0.05, 0.10, 0.20].forEach(function (th) {
        svg.appendChild(A.el("text", { x: W - P.r - 2, y: y(th) - 3, "text-anchor": "end", class: "axl", style: "font-size:9.5px" }, "±" + th.toFixed(2) + " m tide-match tolerance"));
      });
      rows.forEach(function (r) {
        var p = A.BYID[r.acquisition_id];
        if (p) svg.appendChild(A.mark(p, x(r.mean_m), y(r.difference_m), { r: 3.8, sel: p.id === A.state.selected,
          title: r.acquisition_id + "\nInwood − Rockaway " + A.sgn(r.difference_m) + " m\nmean " + A.sgn(r.mean_m) + " m" }));
      });
      hostEl.appendChild(svg);
      hostEl.appendChild(A.h("p", "cap",
        "Every overpass on both tracks. The shaded bands are the three tide-match tolerances offered in chapter 07. " +
        "The gauges disagree most at the extremes of the tide, which is where the bay's own surface gradient is largest."));
    }
  });
})();

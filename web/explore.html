<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GROUNDTRUTH — The bay beneath the city</title>

<!--
  THE ATLAS PAGE.

  One editorial page over the exported data products, drawn in inline SVG with
  no libraries and no build step. Four recurring devices carry the argument:

    GeoLocator        Brooklyn-Queens outline with the study window (place)
    TideStaff         water level against NAVD88 for the selected overpass (process)
    ObservationMark   circle = descending, square = ascending, hollow = failed
                      the coverage screen (observation)
    Evidence line     n, orbit, polarisation, exclusions, measured / modelled (limits)

  One shared selection: click an observation anywhere and every view follows.
  Nothing is interpolated or smoothed. The map base is a temporal-median radar
  image, not a flood map: moving the tide staff never moves a shoreline.

  Data base defaults to ./data-app/ ; override with ?data=https://host/path/ .
  Reads models.json, timeseries.json, hydrographs.json, environment.json,
  acquisitions.json, and optionally basemap.json and restoration_projects.geojson.
  The science stays in Python; this page only draws what Python computed.
-->

<style>
  :root {
    --paper:#F3F0E8; --card:#FAF8F2; --ink:#243846; --muted:#5f6e77; --faint:#93a0a6; --rule:#d6d0c1;
    --desc:#367DA4; --asc:#C7774C; --marsh:#788A70; --water:#dfe7e6; --sel:#111c24;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--paper); color:var(--ink); font:15px/1.55 var(--sans); }
  a { color:var(--ink); text-decoration-color:var(--faint); text-underline-offset:2px; }
  .page { max-width:1180px; margin:0 auto; padding:0 28px 72px; }
  .num, .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }

  .mast { display:grid; grid-template-columns:132px 1fr; gap:26px; align-items:end; padding:40px 0 22px; border-bottom:1.5px solid var(--ink); }
  .mast svg { width:132px; height:auto; display:block; }
  .kicker { font:600 11.5px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  h1 { font:500 clamp(34px,5.4vw,58px)/1.02 var(--serif); letter-spacing:-.015em; margin:0 0 10px; }
  .deck { font:italic 400 clamp(17px,2.1vw,22px)/1.35 var(--serif); color:var(--muted); margin:0; max-width:34em; }
  .lede { font:400 17.5px/1.6 var(--serif); max-width:44em; margin:26px 0 0; }

  section { margin-top:64px; }
  .chap { display:grid; grid-template-columns:132px 1fr; gap:26px; align-items:baseline; margin-bottom:18px; }
  .chap .no { font:600 11.5px/1.4 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  h2 { font:500 clamp(24px,3vw,32px)/1.12 var(--serif); margin:0 0 6px; letter-spacing:-.01em; }
  .chap p { font:400 16px/1.6 var(--serif); margin:0; max-width:46em; }
  h3 { font:600 12px/1.3 var(--sans); letter-spacing:.12em; text-transform:uppercase; margin:0 0 6px; }
  .prose { font:400 15.5px/1.6 var(--serif); margin:0 0 10px; max-width:44em; }
  .cap { font-size:12.5px; color:var(--muted); margin:8px 0 0; max-width:60em; }
  .evidence { font:12px/1.5 var(--mono); color:var(--muted); border-top:1px solid var(--rule); padding-top:7px; margin-top:10px; }
  .evidence b { color:var(--ink); font-weight:600; }

  .stage { display:grid; grid-template-columns:minmax(0,1.62fr) minmax(0,1fr); gap:34px; align-items:start; }
  .mapwrap { display:grid; grid-template-columns:minmax(0,1fr) 84px; gap:10px; align-items:start; }
  .mapwrap svg.map { border:1px solid var(--ink); background:var(--water); }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:34px; }
  .two { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:34px; align-items:start; }
  @media (max-width:900px){
    .mast,.chap { grid-template-columns:1fr; gap:12px; } .mast svg{ width:96px; }
    .stage,.pair,.two { grid-template-columns:1fr; } .mapwrap { grid-template-columns:minmax(0,1fr) 58px; }
  }

  svg { width:100%; height:auto; display:block; }
  .axis text { fill:var(--muted); font:10.5px var(--mono); }
  .axis line { stroke:var(--rule); }
  .axl { fill:var(--muted); font:11px var(--sans); }
  .lab { fill:var(--ink); font:11px var(--sans); }
  .labm { fill:var(--ink); font:11px var(--mono); }
  .pt { cursor:pointer; outline:none; }
  .pt:focus-visible .m { stroke:var(--sel); stroke-width:2.5; }
  .region { fill:var(--marsh); fill-opacity:.28; stroke:#55664f; stroke-width:.7; cursor:pointer; }
  .region:hover { fill-opacity:.5; }
  .region.on { fill:#F3F0E8; fill-opacity:.85; stroke:var(--sel); stroke-width:1.4; }

  .obs { border-top:1.5px solid var(--ink); padding-top:10px; }
  .obs .date { font:500 26px/1.1 var(--serif); margin:2px 0 2px; }
  .obs .big { font:500 34px/1 var(--mono); letter-spacing:-.03em; margin:10px 0 2px; }
  dl.facts { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin:12px 0 0; font-size:13px; }
  dl.facts dt { color:var(--muted); } dl.facts dd { margin:0; font-family:var(--mono); font-size:12.5px; }
  .flag { display:inline-block; font:11px var(--mono); border:1px solid var(--ink); padding:0 5px; margin:2px 4px 0 0; }

  .ctl { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin:10px 0; font-size:13px; }
  .seg { display:inline-flex; border:1px solid var(--ink); }
  .seg button { background:transparent; color:var(--ink); border:0; padding:5px 11px; cursor:pointer; font:13px var(--sans); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .seg button:not(:last-child){ border-right:1px solid var(--ink); }
  label.chk { display:inline-flex; gap:7px; align-items:center; cursor:pointer; }
  .slope { font:500 40px/1 var(--mono); letter-spacing:-.03em; }
  .unit { font:12px var(--mono); color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.tm th { text-align:right; color:var(--muted); font:600 10.5px var(--sans); text-transform:uppercase; letter-spacing:.08em; padding:4px 8px; border-bottom:1px solid var(--ink); }
  table.tm td { text-align:right; padding:3px 8px; border-top:1px solid var(--rule); white-space:nowrap; font-family:var(--mono); }
  table.tm th:first-child, table.tm td:first-child { text-align:left; }
  table.tm tr.cand { cursor:pointer; } table.tm tr.cand:hover td { background:#ebe7da; }
  table.tm tr.near td { background:rgba(120,138,112,.16); }
  table.tm tr.refrow td { border-top:1.5px solid var(--ink); border-bottom:1.5px solid var(--ink); font-weight:600; }
  .bar { display:inline-block; height:5px; vertical-align:middle; background:var(--faint); }
  .near .bar { background:var(--marsh); }
  .tmscroll { max-height:330px; overflow:auto; border-bottom:1px solid var(--rule); }
  table.ctx td { padding:8px 10px 8px 0; border-top:1px solid var(--rule); vertical-align:top; }
  table.ctx td:first-child { font-family:var(--serif); font-size:14.5px; width:38%; }
  .status { font:11px var(--mono); color:var(--muted); display:block; margin-top:2px; }
  .limits { font:400 14.5px/1.6 var(--serif); color:var(--muted); max-width:52em; }
  .err { border:1.5px solid var(--asc); padding:14px 16px; margin-top:30px; }
  .im { display:inline-block; width:.8em; height:.8em; vertical-align:-.04em; margin:0 .12em 0 .05em; }
  .rule-s, .rule-d { display:inline-block; width:1.5em; height:0; vertical-align:.28em; border-top:2px solid var(--ink); margin:0 .2em; }
  .rule-d { border-top-style:dashed; }
  .hatch { display:inline-block; width:1.1em; height:.8em; vertical-align:-.05em; margin:0 .2em; border:1px solid var(--ink);
    background:repeating-linear-gradient(135deg,var(--ink) 0 1.5px,transparent 1.5px 4px); }
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <div id="locator" aria-hidden="true"></div>
    <div>
      <p class="kicker">Groundtruth / Jamaica Bay</p>
      <h1>The bay beneath the city</h1>
      <p class="deck">A satellite, two viewing directions, and the tide hidden inside a radar image.</p>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>
"use strict";
const DATA = new URL(new URLSearchParams(location.search).get("data") || "./data-app/", location.href);
const ORBITS = {
  descending_069:{ label:"Descending 069", short:"descending", color:"#367DA4", shape:"circle" },
  ascending_133: { label:"Ascending 133",  short:"ascending",  color:"#C7774C", shape:"square" },
};
const INK="#243846", MUTED="#5f6e77", FAINT="#93a0a6", RULE="#d6d0c1", MARSH="#788A70", PAPER="#F3F0E8", SEL="#111c24";
const THRESHOLDS=[0.05,0.10,0.20];
const state = { selected:null, orbit:"descending_069", includePartial:false, showAdj:true, matchThresh:0.10, region:null };
let MODELS, SERIES, HYDRO, ENV, ACQ, BASE, PROJECTS, PTS={}, BYID={};

async function getJSON(name){ const r=await fetch(new URL(name,DATA)); if(!r.ok) throw new Error(`${name}: HTTP ${r.status}`); return r.json(); }

(async function init(){
  try {
    [MODELS,SERIES,HYDRO,ENV,ACQ,BASE,PROJECTS] = await Promise.all([
      getJSON("models.json"), getJSON("timeseries.json"), getJSON("hydrographs.json"), getJSON("environment.json"),
      getJSON("acquisitions.json"), getJSON("basemap.json").catch(()=>null), getJSON("restoration_projects.geojson").catch(()=>null) ]);
  } catch(e){
    document.getElementById("app").innerHTML = `<div class="err"><b>Could not load the data products.</b><br>${e.message}<br><br>`+
      `Expected JSON under <code>${DATA.href}</code>. Generate with <code>tide_adjust.py</code> and <code>make_basemap.py</code>, or pass <code>?data=&lt;url&gt;</code>.</div>`;
    return;
  }
  const env=Object.fromEntries(ENV.observations.map(o=>[o.acquisition_id,o]));
  const acq=Object.fromEntries(ACQ.acquisitions.map(a=>[a.acquisition_id,a]));
  for(const orbit in ORBITS){
    PTS[orbit]=SERIES.pooled[orbit].map(p=>({ id:p.acquisition_id, orbit, date:p.date, t:Date.parse(p.date+"T00:00:00Z"),
      h:p.mean_water_level_m_navd88, y:p.marsh_relative_db, hh:p.marsh_hh_db, hv:p.marsh_hv_db, yhv:p.marsh_relative_hv_db,
      ok:p.passes_coverage_screen, env:env[p.acquisition_id]||{quality_flags:[]}, acq:acq[p.acquisition_id]||{} }));
    PTS[orbit].forEach(p=>BYID[p.id]=p);
  }
  state.selected = PTS.descending_069[0].id;
  drawLocator();
  render();
})();

// ---- helpers ----------------------------------------------------------------
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},kids=[]){ const n=document.createElementNS(NS,tag);
  for(const k in attrs) if(attrs[k]!=null) n.setAttribute(k,attrs[k]);
  for(const c of [].concat(kids)) n.appendChild(typeof c==="string"?document.createTextNode(c):c); return n; }
function h(tag,cls,html){ const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function scale(d0,d1,r0,r1){ const m=(r1-r0)/((d1-d0)||1); return v=>r0+(v-d0)*m; }
function ticks(lo,hi,n=5){ const s0=(hi-lo||1)/n, mag=Math.pow(10,Math.floor(Math.log10(s0))), nr=s0/mag, st=(nr<1.5?1:nr<3?2:nr<7?5:10)*mag;
  const t=[]; for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) t.push(+v.toFixed(10)); return t; }
const ext=a=>[Math.min(...a),Math.max(...a)];
const median=a=>{ if(!a.length) return NaN; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const sgn=(v,d=2)=> v==null||!isFinite(v) ? "—" : (v>=0?"+":"−")+Math.abs(v).toFixed(d);
const fx=(v,d=2)=> v==null||!isFinite(v) ? "—" : (v<0?"−":"")+Math.abs(v).toFixed(d);
const variantOf=o=> (o==="ascending_133" && !state.includePartial && MODELS.tracks[o].series.coverage_screened) ? "coverage_screened" : "all_dates";
const model=o=>MODELS.tracks[o].series[variantOf(o)];
const inFit=p=> variantOf(p.orbit)==="all_dates" || p.ok;
function select(id){ state.selected=id; state.orbit=BYID[id].orbit; render(); }

// The one observation mark. Circle = descending, square = ascending, hollow = failed the coverage screen.
function mark(p,x,y,{r=4.2,sel=false,click=true,title}={}){
  const o=ORBITS[p.orbit], rr=sel?r+2.2:r;
  const a={class:"m", fill:p.ok?o.color:PAPER, stroke:sel?SEL:o.color, "stroke-width":sel?2.2:(p.ok?0:1.6)};
  const shape = o.shape==="circle" ? el("circle",{cx:x,cy:y,r:rr,...a}) : el("rect",{x:x-rr*.9,y:y-rr*.9,width:rr*1.8,height:rr*1.8,...a});
  const g=el("g",{class:click?"pt":"",tabindex:click?0:null,role:click?"button":null,
    "aria-label":`${o.short} ${p.date}, water level ${p.h.toFixed(2)} metres${p.ok?"":", failed coverage screen"}`},[shape]);
  g.append(el("title",{},title||`${p.date} · ${o.label}\nh ${fx(p.h)} m · marsh−upland ${fx(p.y)} dB${p.ok?"":"\nfailed the coverage screen"}`));
  if(click){ g.onclick=()=>select(p.id); g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(p.id); } }; }
  return g;
}
// The same mark, inline in prose.
function im(orbit,hollow=false){ const o=ORBITS[orbit], f=hollow?PAPER:o.color;
  const s=o.shape==="circle"?`<circle cx="6" cy="6" r="4.6" fill="${f}" stroke="${o.color}" stroke-width="1.6"/>`
    :`<rect x="1.6" y="1.6" width="8.8" height="8.8" fill="${f}" stroke="${o.color}" stroke-width="1.6"/>`;
  return `<svg class="im" viewBox="0 0 12 12" aria-hidden="true">${s}</svg>`; }
function axes(svg,x,y,P,W,H,xt,yt,xf,yf){ const ax=el("g",{class:"axis"});
  xt.forEach(t=>{ ax.append(el("line",{x1:x(t),x2:x(t),y1:P.t,y2:H-P.b})); ax.append(el("text",{x:x(t),y:H-P.b+15,"text-anchor":"middle"},xf(t))); });
  yt.forEach(t=>{ ax.append(el("line",{x1:P.l,x2:W-P.r,y1:y(t),y2:y(t)})); ax.append(el("text",{x:P.l-6,y:y(t)+3.5,"text-anchor":"end"},yf(t))); });
  svg.append(ax); }
function monthTicks(t0,t1){ const out=[], d0=new Date(t0); for(let d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,1)); d.getTime()<=t1; d.setUTCMonth(d.getUTCMonth()+2)) out.push(d.getTime()); return out; }
const monthFmt=t=>{ const d=new Date(t); return d.toLocaleString("en",{month:"short",timeZone:"UTC"})+(d.getUTCMonth()<=1?" ’"+String(d.getUTCFullYear()).slice(2):""); };

// ---- GeoLocator --------------------------------------------------------------
function drawLocator(){
  const host=document.getElementById("locator"); if(!BASE||!BASE.locator){ host.remove(); document.querySelector(".mast").style.gridTemplateColumns="1fr"; return; }
  const L=BASE.locator, all=L.boroughs.flatMap(b=>b.rings.flat()).concat(L.window);
  const [x0,x1]=ext(all.map(c=>c[0])), [y0,y1]=ext(all.map(c=>c[1])), k=Math.cos(40.65*Math.PI/180);
  const W=132, s=(W-4)/((x1-x0)*k), H=(y1-y0)*s+4, X=c=>2+(c[0]-x0)*k*s, Y=c=>2+(y1-c[1])*s;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H.toFixed(1)}`});
  L.boroughs.forEach(b=>b.rings.forEach(r=>svg.append(el("path",{d:r.map((c,i)=>`${i?"L":"M"}${X(c).toFixed(1)} ${Y(c).toFixed(1)}`).join("")+"Z",fill:INK}))));
  svg.append(el("path",{d:L.window.map((c,i)=>`${i?"L":"M"}${X(c).toFixed(1)} ${Y(c).toFixed(1)}`).join("")+"Z",fill:ORBITS.descending_069.color,"fill-opacity":.22,stroke:ORBITS.descending_069.color,"stroke-width":1.4}));
  svg.append(el("title",{},"Brooklyn and Queens, with the Jamaica Bay study window"));
  host.append(svg);
}

// =============================================================================
function render(){
  const keepY=window.scrollY, app=document.getElementById("app"); app.innerHTML="";
  const d=MODELS.tracks.descending_069.series.all_dates, a=MODELS.tracks.ascending_133.series, as=a.coverage_screened||a.all_dates;
  const nEx=PTS.ascending_133.filter(p=>!p.ok).length;
  app.append(h("p","lede",
    `We matched ${im("descending_069")}<b>${d.n} descending observations</b> and ${im("ascending_133")}<b>${as.n} quality-screened ascending observations</b> `+
    `from NASA’s NISAR radar with water levels measured by two USGS gauges within minutes of each overpass. `+
    `As the water rises, the marsh returns less of the radar signal: about <span class="num">${fx(d.regression.slope_db_per_m)}</span> and <span class="num">${fx(as.regression.slope_db_per_m)}</span> dB per metre. `+
    `The ${im("ascending_133",true)}<b>hollow marks</b> are ${nEx} ascending passes that covered only part of the bay. They stay visible everywhere on this page.`));

  // 01 OBSERVE
  const s1=h("section"); app.append(s1);
  s1.append(chapter("01 / Observe","The satellite catches moments",
    `The tide in Jamaica Bay swings twice a day. NISAR returns on each track every twelve days and takes one instant of that rhythm. `+
    `Each observation below carries the water level the gauges recorded when it was made.`));
  const stage=h("div","stage"), left=h("div"), right=h("div"); stage.append(left,right); s1.append(stage);
  drawMap(left); drawObservation(right); drawHydro(right);
  const con=h("div"); con.style.marginTop="40px"; s1.append(con); drawConstellation(con);

  // 02 COMPARE
  const s2=h("section"); app.append(s2);
  s2.append(chapter("02 / Compare","A pattern emerges, twice",
    `Each viewing direction is its own experiment, with its own baseline. Both show weaker marsh backscatter at higher water. `+
    `A <span class="rule-d"></span>dashed rule is a fitted line; every mark is one measured pass.`));
  const pair=h("div","pair"); s2.append(pair); drawScatter(pair,"descending_069"); drawScatter(pair,"ascending_133");
  const lim=h("div"); lim.style.marginTop="26px"; s2.append(lim); drawLimits(lim);
  const tm=h("div"); tm.style.marginTop="44px"; s2.append(tm); drawTideMatch(tm);

  // 03 INTERROGATE
  const s3=h("section"); app.append(s3);
  s3.append(chapter("03 / Interrogate","What is left when the tide is taken out",
    `If water level explains part of the swing, removing the fitted part should leave a steadier series on dates the model never saw. `+
    `It does, though some tide signal remains.`));
  const two=h("div","two"), l3=h("div"), r3=h("div"); two.append(l3,r3); s3.append(two);
  drawSeries(l3); drawRegion(r3);

  // 04 CONTEXT
  const s4=h("section"); app.append(s4);
  s4.append(chapter("04 / Context","The city reshaped the bay; the next question is whether this helps restore it",
    `Dredging, filling and marsh loss in Jamaica Bay are documented by independent research, not by this radar analysis. `+
    `These are real restoration projects where tide-aware comparison could later be tested.`));
  drawContext(s4);
  window.scrollTo(0,keepY);
}
function chapter(no,title,text){ const c=h("div","chap"); c.append(h("div","no",no)); const b=h("div"); b.append(h("h2",null,title),h("p",null,text)); c.append(b); return c; }

// ---- map + tide staff --------------------------------------------------------
function drawMap(host){
  const p=BYID[state.selected], wrap=h("div","mapwrap"); host.append(wrap);
  if(BASE){
    const W=BASE.width,H=BASE.height, svg=el("svg",{class:"map",viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Radar map of Jamaica Bay with marsh polygons"});
    svg.append(el("image",{href:BASE.image,x:0,y:0,width:W,height:H,preserveAspectRatio:"none"}));
    BASE.regions.forEach(r=>{ const poly=el("polygon",{class:"region"+(r.region_id===state.region?" on":""),points:r.ring.map(c=>c.join(",")).join(" ")});
      poly.append(el("title",{},`Marsh polygon ${r.region_id} (OpenStreetMap). Click for its series.`));
      poly.onclick=()=>{ state.region=state.region===r.region_id?null:r.region_id; render(); }; svg.append(poly); });
    const cov=BASE.coverage[state.selected];
    if(cov) svg.append(el("image",{href:cov.image,x:0,y:0,width:W,height:H,preserveAspectRatio:"none","pointer-events":"none"}));
    (BASE.projects||[]).forEach(q=>{ const [x,y]=q.px; const g=el("g",{},[el("path",{d:`M${x} ${y-5}L${x+5} ${y}L${x} ${y+5}L${x-5} ${y}Z`,fill:PAPER,stroke:INK,"stroke-width":1.2})]);
      const f=PROJECTS&&PROJECTS.features.find(z=>z.properties.project_id===q.project_id);
      g.append(el("title",{},`${f?f.properties.project_name:q.project_id}\n${q.geometry_kind} — not a project footprint`)); svg.append(g); });
    Object.entries(BASE.gauges||{}).forEach(([k,g])=>{ const [x,y]=g.px;
      svg.append(el("path",{d:`M${x-4.5} ${y+4}L${x+4.5} ${y+4}L${x} ${y-5}Z`,fill:INK,stroke:PAPER,"stroke-width":1}));
      svg.append(el("text",{x:x+7,y:y+4,fill:PAPER,stroke:INK,"stroke-width":2.6,"paint-order":"stroke",style:"font:600 9.5px var(--sans)"},`${k[0].toUpperCase()+k.slice(1)} gauge`)); });
    const km=5000/BASE.pixel_m, bx=W-km-14, by=H-14;

  const W=520,H=320,P={l:46,r:12,t:14,b:38}, xs=ext(pts.map(p=>p.h)), ys=ext(pts.map(p=>p.y)), xp=(xs[1]-xs[0])*.07, yp=(ys[1]-ys[0])*.1;
  const x=scale(xs[0]-xp,xs[1]+xp,P.l,W-P.r), y=scale(ys[0]-yp,ys[1]+yp,H-P.b,P.t);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"group","aria-label":`${o.label}: marsh-relative backscatter against water level`});
  axes(svg,x,y,P,W,H,ticks(xs[0]-xp,xs[1]+xp),ticks(ys[0]-yp,ys[1]+yp,4),t=>sgn(t,1),t=>fx(t,1));

  svg.append(el("text",{class:"axl",x:P.l,y:P.t-3},"marsh − upland HH (dB)"));
  const hm=fit.reduce((s,p)=>s+p.h,0)/fit.length, ym=fit.reduce((s,p)=>s+p.y,0)/fit.length, a=xs[0]-xp, b=xs[1]+xp, ci=reg.slope_ols_95ci;
  const L=(s,v)=>y(ym+s*(v-hm));
  svg.append(el("path",{d:`M${x(a)} ${L(ci[0],a)}L${x(b)} ${L(ci[0],b)}L${x(b)} ${L(ci[1],b)}L${x(a)} ${L(ci[1],a)}Z`,fill:o.color,"fill-opacity":.12}));
  svg.append(el("line",{x1:x(a),y1:y(reg.intercept_db+reg.slope_db_per_m*a),x2:x(b),y2:y(reg.intercept_db+reg.slope_db_per_m*b),stroke:o.color,"stroke-width":2,"stroke-dasharray":"7 4"}));
  pts.filter(p=>p.id!==state.selected).forEach(p=>svg.append(mark(p,x(p.h),y(p.y))));

  box.append(svg);

}

// ---- tide match -----------------------------------------------------------------
function drawTideMatch(host){
  const o=ORBITS[state.orbit], m=model(state.orbit), adj=Object.fromEntries(m.per_date.map(d=>[d.date,d.y_adj_in_sample_db]));
  const pool=PTS[state.orbit].filter(inFit), ref=pool.find(p=>p.id===state.selected)||pool[0], thr=state.matchThresh;
  host.append(h("h3",null,"Tide match: which passes are comparable?"));
  const rows=pool.filter(p=>p.id!==ref.id).map(p=>({p,dh:p.h-ref.h,dy:p.y-ref.y,da:adj[p.date]!=null&&adj[ref.date]!=null?adj[p.date]-adj[ref.date]:null,dd:Math.round((p.t-ref.t)/864e5)}))
    .sort((a,b)=>Math.abs(a.dh)-Math.abs(b.dh));
  const near=rows.filter(r=>Math.abs(r.dh)<=thr), far=rows.filter(r=>Math.abs(r.dh)>thr), md=a=>median(a.map(r=>Math.abs(r.dy)));
  host.append(h("p","prose",
    `Reference ${im(ref.orbit,!ref.ok)}<b>${ref.date}</b> at <span class="num">${sgn(ref.h)}</span> m. `+
    (near.length?`<b>${near.length}</b> other ${o.short} pass${near.length>1?"es":""} had water within ±<span class="num">${thr.toFixed(2)}</span> m. Against those the median backscatter difference is `+
      `<span class="num">${fx(md(near))}</span> dB${far.length?`; against the rest it is <span class="num">${fx(md(far))}</span> dB`:""}.`
      :`No other ${o.short} pass had water within ±<span class="num">${thr.toFixed(2)}</span> m; the closest is ${rows[0].p.date}, <span class="num">${fx(Math.abs(rows[0].dh))}</span> m away.`)+
    ` Comparing passes at matched tide removes a difference that is not ecological.`));
  const ctl=h("div","ctl"); ctl.innerHTML=`<span>Similar if |Δh| ≤</span><span class="seg">${THRESHOLDS.map(t=>`<button data-t="${t}" aria-pressed="${t===thr}">${t.toFixed(2)} m</button>`).join("")}</span>`+
    `<span class="seg" id="tm-orb">${Object.entries(ORBITS).map(([k,v])=>`<button data-o="${k}" aria-pressed="${k===state.orbit}">${v.label}</button>`).join("")}</span>`;
  host.append(ctl);
  ctl.querySelector(".seg").onclick=e=>{ const b=e.target.closest("button"); if(b){ state.matchThresh=+b.dataset.t; render(); } };
  ctl.querySelector("#tm-orb").onclick=e=>{ const b=e.target.closest("button"); if(b&&b.dataset.o!==state.orbit) select(PTS[b.dataset.o].filter(inFit)[0].id); };
  const mx=Math.max(...rows.map(r=>Math.abs(r.dh)),.01), wrap=h("div","tmscroll"), t=h("table","tm");
  t.innerHTML=`<thead><tr><th>Date</th><th>Days apart</th><th>h (m)</th><th>Δh (m)</th><th>ΔY raw (dB)</th><th>ΔY tide-adjusted (dB)</th></tr></thead><tbody>`+
    `<tr class="refrow"><td>${ref.date} · reference</td><td>0</td><td>${sgn(ref.h)}</td><td>—</td><td>—</td><td>—</td></tr>`+
    rows.map(r=>`<tr class="cand${Math.abs(r.dh)<=thr?" near":""}" data-id="${r.p.id}" tabindex="0"><td>${r.p.date}</td><td>${sgn(r.dd,0)}</td><td>${sgn(r.p.h)}</td>`+
      `<td><span class="bar" style="width:${Math.round(40*Math.abs(r.dh)/mx)}px"></span> ${sgn(r.dh)}</td><td>${sgn(r.dy)}</td><td>${sgn(r.da)}</td></tr>`).join("")+`</tbody>`;
  t.onclick=e=>{ const tr=e.target.closest("tr.cand"); if(tr) select(tr.dataset.id); };
  t.onkeydown=e=>{ const tr=e.target.closest("tr.cand"); if(tr&&e.key==="Enter") select(tr.dataset.id); };
  wrap.append(t); host.append(wrap);
  host.append(h("div","evidence",`<b>measured</b> Δh, ΔY raw · <b>modelled</b> ΔY tide-adjusted (in-sample fit, descriptive) · ${o.label} only, ${pool.length} passes in the fit · rows share the reference, so they are not independent tests · click a row to make it the reference`));
}

  axes(svg,x,y,P,W,H,monthTicks(ts[0],ts[1]),ticks(ys[0]-yp,ys[1]+yp,4),monthFmt,t=>fx(t,1));
  svg.append(el("text",{class:"axl",x:P.l,y:P.t-4},"marsh − upland HH (dB)"));
  const path=v=>v.map((q,i)=>`${i?"L":"M"}${x(T[i]).toFixed(1)} ${y(q).toFixed(1)}`).join("");
  if(state.showAdj){ svg.append(el("path",{d:path(adj),fill:"none",stroke:INK,"stroke-width":1.6,"stroke-dasharray":"6 4"}));
    adj.forEach((v,i)=>svg.append(el("circle",{cx:x(T[i]),cy:y(v),r:2,fill:INK})));
    svg.append(el("text",{x:x(T[0])+4,y:y(adj[0])+(adj[0]<raw[0]?16:-9),class:"lab"},"tide-adjusted")); }
  svg.append(el("path",{d:path(raw),fill:"none",stroke:o.color,"stroke-width":1.4}));
  pd.forEach((d,i)=>{ const p=PTS[orbit].find(q=>q.date===d.date); svg.append(mark(p,x(T[i]),y(raw[i]),{r:3.6,sel:p.id===state.selected})); });
  svg.append(el("text",{x:x(T[0])+4,y:y(raw[0])+(adj[0]<raw[0]||!state.showAdj?-9:16),fill:o.color,style:"font:11px var(--sans)"},"raw"));
  host.append(svg);
  host.append(h("p","prose",
    `On the held-out dates the spread falls from <span class="num">${fx(ho.raw.sd_db)}</span> to <span class="num">${fx(ho.adjusted.sd_db)}</span> dB, and the tide model predicts them with `+
    `<span class="num">${(bh.tide.rmse_improvement_vs_constant*100).toFixed(0)}%</span> lower error than a constant `+
    `(<span class="num">${(br.tide.rmse_improvement_vs_constant*100).toFixed(0)}%</span> on a rolling origin). `+
    `The adjusted values still correlate with water level at <span class="num">${fx(ho.adjusted.r_with_water_level)}</span> (raw: <span class="num">${fx(ho.raw.r_with_water_level)}</span>), so the correction is partial. `+
    `A seasonal model did worse than a constant.`));
  const tr=m.trend;
  host.append(h("div","evidence",`<b>measured</b> raw · <b>modelled</b> adjusted = raw − β·(h − ${fx(ta.h_ref_m_navd88,1)} m), β from all ${m.n} dates (descriptive) · held-out statistics use β from the first half only · n test = ${ho.n} · `+
    `exploratory trend ${sgn(tr.gamma_db_per_year)} dB/yr, CI ${sgn(tr.gamma_95ci_db_per_year[0])} to ${sgn(tr.gamma_95ci_db_per_year[1])}: not distinguishable from zero, and not a subsidence or land-loss rate`));
}

// ---- one marsh polygon, descriptively -----------------------------------------
function drawRegion(host){
  host.append(h("h3",null,"One marsh at a time"));
  const R=SERIES.regions[state.orbit], o=ORBITS[state.orbit], fits=R.regions.map(r=>r.tide_response).filter(f=>f.model_status==="exploratory");
  host.append(h("p","prose",
    `The relationship is established for the sampled marsh ensemble. How tidal sensitivity varies within the bay is still under investigation: `+
    `of ${fits.length} polygons with enough ${o.short} passes to fit, <span class="num">${fits.filter(f=>f.slope_db_per_m<0).length}</span> have a negative slope and `+
    `<span class="num">${fits.filter(f=>f.p_uncorrected<.05).length}</span> pass an uncorrected 5% test. So the map does not colour marshes by slope.`));
  const r=R.regions.find(q=>q.region_id===state.region);
  if(!r){ host.append(h("p","cap","Click a marsh polygon on the map to see its own measurements here.")); return; }
  const ids=R.acquisition_ids, pts=ids.map((id,i)=>({p:BYID[id],v:r.marsh_relative_db[i],c:r.coverage_fraction[i]})).filter(q=>q.v!=null&&q.p);
  const f=r.tide_response, box=h("div","obs"); host.append(box);
  box.append(h("div",null,`<span class="mono">${r.region_id}</span> · ${r.kind||"wetland"} · <span class="mono">${r.n_pixels}</span> pixels at 10 m`));
  if(pts.length>1){
    const W=420,H=180,P={l:40,r:10,t:12,b:26}, ts=ext(pts.map(q=>q.p.t)), ys=ext(pts.map(q=>q.v)), yp=(ys[1]-ys[0])*.12||.2;
    const x=scale(ts[0]-8*864e5,ts[1]+8*864e5,P.l,W-P.r), y=scale(ys[0]-yp,ys[1]+yp,H-P.b,P.t), svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"group","aria-label":"This polygon's marsh-relative backscatter over time"});
    axes(svg,x,y,P,W,H,monthTicks(ts[0],ts[1]),ticks(ys[0]-yp,ys[1]+yp,3),monthFmt,t=>fx(t,1));
    svg.append(el("path",{d:pts.map((q,i)=>`${i?"L":"M"}${x(q.p.t).toFixed(1)} ${y(q.v).toFixed(1)}`).join(""),fill:"none",stroke:o.color,"stroke-width":1.2}));
    pts.forEach(q=>svg.append(mark({...q.p,ok:q.c>=.9},x(q.p.t),y(q.v),{r:3.2,sel:q.p.id===state.selected,title:`${q.p.date}\n${fx(q.v)} dB · coverage ${(q.c*100).toFixed(0)}% · h ${fx(q.p.h)} m`})));
    box.append(svg);
  }
  box.append(h("p","cap",`This polygon’s median HH minus the upland reference, ${o.short} passes. Hollow marks here mean under 90% of this polygon was observed on that date.`));
  box.append(h("div","evidence", f.model_status==="exploratory"
    ? `<b>exploratory</b> · slope ${sgn(f.slope_db_per_m)} dB/m · r ${fx(f.pearson_r)} · p ${f.p_uncorrected<.001?"<0.001":f.p_uncorrected.toFixed(3)} uncorrected across ${fits.length} polygons · n = ${f.n} · not a validated per-marsh result`
    : `<b>insufficient evidence</b> · only ${f.n} usable passes · no model fitted`));
}

// ---- restoration context ----------------------------------------------------------
function drawContext(host){
  if(PROJECTS){ const t=h("table","ctx");
    t.innerHTML=PROJECTS.features.map(f=>{ const p=f.properties; return `<tr><td>${p.project_name}<span class="status">${p.published_status} · as of ${p.status_as_of}</span></td>`+
      `<td>${p.restoration_goal||""} ${p.construction_notes||""} <a href="${p.source_url}" target="_blank" rel="noopener">Source</a><span class="status">${p.agency} · ${p.geometry_kind} · ${p.verification}</span></td></tr>`; }).join("");
    host.append(t);
    host.append(h("div","evidence",`<b>proposed</b> use, nothing here is measured by the radar · no project boundaries held · each status is evidence as of its date`)); }
  const lh=h("h3",null,"What this page does not show"); lh.style.marginTop="34px"; host.append(lh);
  host.append(h("p","limits",
    `The negative slope is a measured association between water level and marsh-relative backscatter. It is not a measurement of marsh loss, flood protection, or restoration success, and it does not identify the scattering mechanism. `+
    `Ascending and descending passes are never pooled. Marsh polygons come from OpenStreetMap, not the National Wetlands Inventory, and the upland reference is a brightness proxy. `+
    `Wind and rain are daily values, not values at the overpass. Trend and persistence diagnostics are exploratory.`));
}
</script>
